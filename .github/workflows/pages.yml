# Publish the site to GitHub Pages.
#
# The default "deploy from a branch" pipeline wedged on 6 August 2026: build and
# upload succeeded every time, then the deploy step polled its own deployment
# for ten minutes and aborted. Eight consecutive failures, no incident open, no
# protection rule to explain it. This takes the other deployment path.
#
# Nothing is built. The repository is already the site — the upload step just
# takes the checkout as-is, which is also why no dependency is installed.

name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repo, mint the OIDC token deploy-pages needs, write the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Superseded runs are cancelled rather than queued. The first version of this
# waited for the run in flight, on the reasoning that a half-applied deploy is
# worse than a stale site. That was wrong in one specific way: a run that never
# finishes then blocks every later one for good, which is exactly what happened
# when a history rewrite orphaned the commit a queued run was waiting on. It
# could not be cancelled — GitHub returned a 502 to both cancel and
# force-cancel — and three pushes after it produced no run at all.
#
# The group is renamed as well as the policy changed, because the old group
# still holds that unkillable run.
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Members — Smart Money, Plain English</title>
<meta name="description" content="Members-only notes and material.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-top">
      <a class="brand" href="index.html">smart money <b>/</b> plain english</a>
      <div class="account-strip" id="account-strip"></div>
    </div>
    <nav class="site">
      <a href="index.html">start</a>
      <a href="liquidity.html">liquidity</a>
      <a href="pd-arrays.html">pd arrays</a>
      <a href="structure.html">structure</a>
      <a href="time.html">time</a>
      <a href="models.html">models</a>
      <a href="glossary.html">glossary</a>
      <a href="members.html" aria-current="page">members</a>
    </nav>
  </div>
</header>

<div class="wrap">
<main>

<h1>Members area</h1>

<div id="auth-root"></div>

<div id="members-body" hidden>
  <p class="lede" id="greeting"></p>
  <div id="lessons"></div>
</div>

</main>

<footer class="site">
  <p>Smart Money, Plain English — a static, no-framework study site.<br>
  Educational content only. Not financial advice. Trading involves substantial risk of loss.</p>
</footer>
</div>

<script type="module">
import DOMPurify from 'https://esm.sh/dompurify@3';
import { supabase, requireRole, renderAccountStrip, escapeHtml,
         youtubeEmbed, safeUrl } from './app.js';

renderAccountStrip();

const profile = await requireRole(['member', 'admin']);

if (profile) {
  document.getElementById('members-body').hidden = false;
  document.getElementById('greeting').textContent =
    'Signed in as ' + (profile.full_name || profile.email) + '.';

  const mount = document.getElementById('lessons');

  try {
    const { data: lessons, error } = await supabase
      .from('lessons')
      .select('id, slug, title, summary, body_html, video_url')
      .eq('published', true)
      .order('sort_order', { ascending: true })
      .order('created_at', { ascending: true });

    if (error) throw error;

    if (!lessons.length) {
      mount.innerHTML =
        '<div class="callout"><span class="callout-label">Empty</span>' +
        '<p>No entries have been published yet. Add one from the admin page.</p></div>';
    } else {
      // Attachment links for every visible lesson, in one round trip.
      const byLesson = new Map();
      const { data: links } = await supabase
        .from('lesson_links')
        .select('lesson_id, label, url, sort_order')
        .in('lesson_id', lessons.map((l) => l.id))
        .order('sort_order', { ascending: true });

      for (const link of links || []) {
        if (!byLesson.has(link.lesson_id)) byLesson.set(link.lesson_id, []);
        byLesson.get(link.lesson_id).push(link);
      }

      mount.innerHTML = lessons.map((row) => {
        // The body is admin-authored HTML, but it is still sanitised before it
        // reaches the page: a second admin, or a careless paste, should not be
        // able to run script on everyone else's browser.
        const body = DOMPurify.sanitize(row.body_html || '', {
          ADD_ATTR: ['target', 'rel']
        });

        const attachments = (byLesson.get(row.id) || [])
          .map((link) => {
            const href = safeUrl(link.url);
            if (!href) return '';
            return '<li><a href="' + escapeHtml(href) + '" target="_blank" ' +
                   'rel="noopener noreferrer">' + escapeHtml(link.label) + '</a></li>';
          })
          .join('');

        return '<article class="lesson" id="' + escapeHtml(row.slug) + '">' +
          '<h2>' + escapeHtml(row.title) + '</h2>' +
          (row.summary ? '<p class="lesson-summary">' + escapeHtml(row.summary) + '</p>' : '') +
          youtubeEmbed(row.video_url) +
          '<div class="lesson-body">' + body + '</div>' +
          (attachments
            ? '<div class="lesson-files"><h3>Attachments</h3><ul>' + attachments + '</ul></div>'
            : '') +
        '</article>';
      }).join('');
    }
  } catch (err) {
    mount.innerHTML =
      '<div class="callout risk"><span class="callout-label">Could not load</span><p>' +
      escapeHtml(err && err.message ? err.message : String(err)) +
      '</p><p>If this mentions <code>video_url</code> or <code>lesson_links</code>, run ' +
      '<code>supabase/lesson-media.sql</code> in the Supabase SQL editor.</p></div>';
  }
}
</script>

</body>
</html>
